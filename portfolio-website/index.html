<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JAMES LIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121210;
    --fg:#f3f1ea;
    --muted:#8f8c81;
    --line:#2c2b26;
    --accent:#c9c0a6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--fg);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
  }

  .bg-video{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
  }
  .bg-video video{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .bg-video::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(18,18,16,.55);
  }

  .splash{
    position:relative;
    z-index:1;
    height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }

  .name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem, 8vw, 4.5rem);
    letter-spacing:.02em;
  }

  .tagline{
    margin-top:14px;
    font-size:12px;
    letter-spacing:.1em;
    color:var(--muted);
    text-transform:uppercase;
  }

  .routes{
    display:flex;
    gap:36px;
    margin-top:56px;
  }
  @media (max-width:480px){
    .routes{ flex-direction:column; gap:20px; margin-top:44px; }
  }
  .routes a{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--fg);
    padding-bottom:4px;
    border-bottom:1px solid var(--line);
    transition:color .25s, border-color .25s;
  }
  .routes a:hover{
    color:var(--accent);
    border-color:var(--accent);
  }

  footer{
    position:fixed;
    bottom:24px; left:0; right:0;
    z-index:1;
    text-align:center;
    font-size:10px;
    letter-spacing:.08em;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="bg-video">
  <video src="videos/AnimationReel_JamesLin2026.mov" autoplay muted loop playsinline preload="auto"></video>
</div>

<div class="splash">
  <div class="name">JAMES LIN</div>
  <div class="tagline">Photography — Film</div>
  <nav class="routes">
    <a href="photo.html">Photo</a>
    <a href="video.html">Video</a>
    <a href="about.html">About</a>
  </nav>
</div>

<footer>Based in Los Angeles</footer>

</body>
</html>
